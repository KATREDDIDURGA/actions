name: Commit

on:
  schedule:
    # Runs every Saturday at 9:00 AM
    - cron: '0 9 * * 6'
    # Runs every Sunday at 9:00 AM
    - cron: '0 9 * * 7'
  push:
  
permissions: write-all

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make a random commit
        run: |
          echo "Random commit on $(date)" >> commit.txt
          git add commit.txt
          git commit -m "Random commit on $(date)"
          git push

  # Add your existing jobs here (keeping them as is)
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      # Your existing steps for the 'test' job...

  verify-dist:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      # Your existing steps for the 'verify-dist' job...

  acceptance-windows:
    runs-on: windows-latest
    if: github.actor != 'dependabot[bot]'
    needs:
      - verify-dist
    steps:
      # Your existing steps for the 'acceptance-windows' job...

  acceptance-linux:
    name: ${{ matrix.job-name }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        job-name: [acceptance-linux]
    runs-on: ${{ matrix.os }}
    if: github.actor != 'dependabot[bot]'
    needs:
      - verify-dist
    steps:
      # Your existing steps for the 'acceptance-linux' job...

  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs:
      - test
      - verify-dist
      - acceptance-windows
      - acceptance-linux
    steps:
      # Your existing steps for the 'release' job...
